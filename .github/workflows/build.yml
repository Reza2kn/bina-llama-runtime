name: Patched Bina runtime
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: bina-runtime-${{ runner.os }}-x64-vulkan
          path: package/
